name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public client configuration, managed in repository Actions variables.
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_CAPABILITY_API_URL: ${{ vars.PUBLIC_CAPABILITY_API_URL }}
      PUBLIC_GA_MEASUREMENT_ID: G-FNWRC3EMV4
      PUBLIC_GA_MEASUREMENT_IDS: ${{ vars.ANSWERWITHBOOKS_GA_MEASUREMENT_IDS }}
      PUBLIC_GOOGLE_SITE_VERIFICATION: xFZB90c9egZSAqh5_HxtLdxhxym5yMcHFYwwYtnwrHg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify signup backend (no email sent)
        run: node scripts/check-signup-backend.mjs

      - name: Verify upstream book adaptation
        run: |
          python3 scripts/book-adapter/test_adapter.py
          node --test scripts/test-book-processing.mjs scripts/test-book-worker.mjs scripts/test-book-parity.mjs scripts/test-long-book.mjs scripts/test-book-cache.mjs

      - name: Set up Deno for the processing handler tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Verify processing handler without network or provider access
        run: |
          deno cache --node-modules-dir=none scripts/test-book-worker-http.ts
          deno check --node-modules-dir=none supabase/functions/book-process/index.ts
          deno run --node-modules-dir=none --allow-env --allow-read scripts/test-book-worker-http.ts

      - name: Verify queue concurrency and account isolation in local Postgres
        run: PG_BIN="$(pg_config --bindir)" python3 scripts/test-book-queue-db.py

      - name: Verify authentication email branding
        run: node scripts/test-auth-email-templates.mjs

      - name: Build
        run: npm run build

      - name: Verify Skills and illustrated guide catalog
        run: node scripts/check-product-surface.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
