name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public client configuration, managed in repository Actions variables.
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_GA_MEASUREMENT_ID: G-FNWRC3EMV4
      PUBLIC_GA_MEASUREMENT_IDS: ${{ vars.ANSWERWITHBOOKS_GA_MEASUREMENT_IDS }}
      PUBLIC_GOOGLE_SITE_VERIFICATION: xFZB90c9egZSAqh5_HxtLdxhxym5yMcHFYwwYtnwrHg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify signup backend (no email sent)
        run: node scripts/check-signup-backend.mjs

      - name: Build
        run: npm run build

      - name: Verify Skills and illustrated guide catalog
        run: node scripts/check-product-surface.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
