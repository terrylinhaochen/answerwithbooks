name: Book processing checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_CAPABILITY_API_URL: ${{ vars.PUBLIC_CAPABILITY_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-guide-suggestions.mjs scripts/test-guide-draft.mjs scripts/test-reading-guides.mjs scripts/test-book-reader.mjs scripts/test-reading-text.mjs scripts/test-guide-proofreading.mjs scripts/test-source-stream.mjs
      - run: npm run test:book-pipeline
      - run: npm run test:book-billing
      - run: node --test scripts/test-book-api-auth.mjs scripts/test-key-dialogs.mjs
      - run: npm run build
      - run: node scripts/check-rendered-covers.mjs
      - name: Install pinned Deno from the official npm package
        # Avoid the GitHub release download outage; keep the runtime and tests unchanged.
        run: |
          npm install --global deno@2.8.3
          deno --version
      - name: Verify financial admission at the provider boundary
        run: |
          deno cache --node-modules-dir=none scripts/test-book-worker-http.ts scripts/test-reading-http.ts
          deno check --node-modules-dir=none supabase/functions/book-process/index.ts supabase/functions/reading-guides/index.ts
          deno run --node-modules-dir=none --allow-env --allow-read scripts/test-book-worker-http.ts
          deno run --node-modules-dir=none --allow-env --allow-read scripts/test-reading-http.ts
      - name: Verify shared sources and subscription allowance
        run: |
          npm run test:shared-library
          deno check --node-modules-dir=none supabase/functions/shared-library/index.ts supabase/functions/reader-subscription/index.ts
          deno run --node-modules-dir=none --allow-env --allow-read scripts/test-shared-http.ts
          deno run --node-modules-dir=none --allow-env --allow-read scripts/test-reader-subscription-http.ts
          PG_BIN="$(pg_config --bindir)" python3 scripts/test-shared-subscription-db.py
