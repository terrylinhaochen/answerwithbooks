project_id = "answerwithbooks"

# Preserve the established production auth contract. These handlers authenticate
# browser JWTs and scoped CLI credentials themselves; queue operations require
# the dedicated runner secret. Gateway JWT-only validation rejects those tokens.
[functions.reading-guides]
verify_jwt = false

[functions.book-process]
verify_jwt = false

# Service-only embedding worker: POST requires the dedicated runner secret.
[functions.reading-index]
verify_jwt = false

# Only the total of ready public books is exposed, without account or source data.
# The public catalog and book pages are read without signing in; the function checks auth per action.
[functions.shared-library]
verify_jwt = false

[functions.library-count]
verify_jwt = false
